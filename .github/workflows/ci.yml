name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Install Playwright browsers
        run: pnpm --filter @playwright-backend-mocks/parity exec playwright install --with-deps chromium

      - name: Browser oracle
        run: pnpm test

      - name: Node passthrough smokes
        run: pnpm test:parity:node

      - name: Dual-mode routing gate (fulfill)
        run: pnpm test:parity:node:fulfill
