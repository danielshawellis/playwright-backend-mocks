name: CI

on:
  pull_request:
  # main pushes run CI via the Publish workflow (tests gate npm publish)
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          # Full oracle + library on the supported LTS pin.
          - node-version: 22
            suite: full
          # Node 26: undici fetch under MSW fails on HTTP/2 TLS (CDN passthrough).
          # Browser oracle URLPattern checks are not Node-26-clean yet; library
          # suite covers the https://example.com / Anthropic regression.
          - node-version: 26
            suite: library
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Install Playwright browsers
        if: matrix.suite == 'full'
        run: pnpm --filter @playwright-backend-mocks/parity exec playwright install --with-deps chromium

      - name: Browser oracle
        if: matrix.suite == 'full'
        run: pnpm test

      - name: Node passthrough smokes
        if: matrix.suite == 'full'
        run: pnpm test:parity:node

      - name: Dual-mode routing gate (fulfill)
        if: matrix.suite == 'full'
        run: pnpm test:parity:node:fulfill

      - name: Full node oracle
        if: matrix.suite == 'full'
        run: pnpm test:parity:node:full

      - name: Library-only suite
        run: pnpm test:library
