# Publish library packages to npm when versions on main are not yet released.
# Auth: npm Trusted Publishing (OIDC) — no NPM_TOKEN. Gated on full CI.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager"

      # Node 22.14+ and npm 11.5.1+ required for trusted publishing / OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Publish unpublished package versions
        run: pnpm publish:packages
        # Do not set NODE_AUTH_TOKEN — npm falls back to OIDC trusted publishing.
