name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Skip publish during rewrite
        run: |
          echo "Library packages are archived under historical/ during the greenfield rewrite."
          echo "Publishing will resume once Step 2 packages land."
          exit 1
